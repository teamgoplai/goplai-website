[build]
  publish = "."
  functions = "netlify/functions"

# Waitlist drip emails — runs daily at 9am UTC (2am PT / 5am ET)
# Gated by DRIP_ENABLED env var on Netlify. Without the flag, runs in
# dry-run mode and logs candidates without sending.
[functions."waitlist-drip"]
  schedule = "0 9 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://cajdlgfdesedrkdozecb.supabase.co; media-src 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/public/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/email-preview.html"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/email-engagement-preview.html"
  to = "/404"
  status = 404
  force = true
